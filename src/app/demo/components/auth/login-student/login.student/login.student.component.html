<div class="login-student-container">
    <div class="login-header">
      <h1>Portal de Estudiantes</h1>
      <p>Inicia sesión con tu cuenta de Google para continuar</p>
    </div>
  
    <div class="login-content">
      <button class="google-login-btn" (click)="loginGoogle()">
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google"
          class="google-icon"
        />
        Continuar con Google
      </button>
    </div>
  
    <div class="login-footer">
      <p>¿Necesitas ayuda? <a href="/soporte">Contáctanos</a></p>
    </div>
  </div>
